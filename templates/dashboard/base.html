{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Django Data Monitor{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar__brand">Analytics Server</div>
            <nav>
                <a href="/" class="sidebar__link active">Dashboard</a>
            </nav>
        </aside>

        <main class="content">
            {% block content %}

              <!-- START - Block content -->

                 <div class="flex items-center justify-center h-screen bg-gray-100 w-full">
                    <div class="p-6 bg-white shadow-md rounded">
                       Block content
                    </div>
                 </div>

              <!-- END - Block content -->

            {% endblock %}
        </main>
    </div>
</body>
</html>
